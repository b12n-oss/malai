name: CI

# Malai's tests, run through Jolt's task runner as on a workstation:
# `jolt verify` runs the suite on Jolt, then on the JVM with Leiningen, and
# `jolt test:cljs` runs upstream Specter's ClojureScript tests. Babashka is
# not needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The oldest Jolt Malai supports, the same as :jolt/min-version in deps.edn.
      - uses: jlt-commons/setup-jolt@v1
        with:
          version: "0.8.27"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: 2.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Jolt and JVM suites
        run: jolt verify

      - name: ClojureScript suite
        run: jolt test:cljs
