name: Site

# Builds the documentation site and publishes it to GitHub Pages. The build
# lives in jlt-commons/ci-builds, shared by every project; what stays here is
# this project's own: docs/, docs/site.edn, the base path below and the
# assertions in docs/check-site.sh.
#
# Manual runs only while the repo is private, since every run is billed.
# When it goes public, restore:
#   push:
#     branches: [main]
#   pull_request:

on:
  workflow_dispatch:

permissions:
  contents: read

# Deploys must not race; pull request builds cancel their own earlier runs.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  site:
    uses: jlt-commons/ci-builds/.github/workflows/site.yml@main
    with:
      base-path: /malai
      # Pinned rather than trusting the shared workflow's default: v0.4.5 is
      # the engine `jolt site:build` uses locally.
      docs-engine-ref: v0.4.5
    permissions:
      contents: read
      pages: write
      id-token: write
